openapi: 3.1.0
info:
  title: Land Tax Calculator GPTs Wrapper Actions
  version: 0.2.0-draft
  description: |
    Draft OpenAPI schema for GPTs Actions using the JSON-friendly /api/gpts/*
    wrapper endpoints. Do not put real auth codes, session tokens, secrets,
    or full PDF download URLs in this file.
servers:
  - url: https://land-tax-calculator-xi.vercel.app
    description: Production Vercel deployment
tags:
  - name: GPTs
    description: JSON-friendly wrapper endpoints for GPTs Actions.
security: []
paths:
  /api/gpts/login:
    post:
      tags: [GPTs]
      operationId: gptsLogin
      summary: Login a store for GPTs
      description: Authenticate a store user and create a short-lived session for GPTs land tax calculation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              placeholder:
                value:
                  storeCode: CH006
                  authCode: DO_NOT_USE_REAL_AUTH_CODE
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsLoginSuccess"
        "401":
          description: Login failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"

  /api/gpts/calculate:
    post:
      tags: [GPTs]
      operationId: gptsCalculate
      summary: Calculate land value increment tax for GPTs
      description: Calculate land tax through the GPTs wrapper. Use after login. If Authorization header is unavailable, pass sessionToken in the request body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateRequest"
            examples:
              v16ProductionBaseline:
                value:
                  landArea: 100
                  ownershipNumerator: 1
                  ownershipDenominator: 1
                  previousTransferYearMonth: "04801"
                  currentTransferYearMonth: "11504"
                  previousDeclaredValuePerSqm: 1000
                  currentDeclaredValuePerSqm: 5000
                  improvementCost: 0
                  landReadjustmentCost: 0
                  engineeringBenefitFee: 0
                  sessionToken: SESSION_TOKEN_PLACEHOLDER
      responses:
        "200":
          description: Calculation succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsCalculateSuccess"
              examples:
                v16ProductionBaseline:
                  value:
                    success: true
                    data:
                      success: true
                      formulaVersion: land-tax-v1.0.0
                      previousIndexValue: 9.86
                      currentIndexValue: 111.23
                      taxIndexMultiplier: 0.0986
                      currentTotalValue: 500000
                      adjustedPreviousTotalValue: 9860
                      taxableIncrement: 490140
                      generalTaxResult:
                        estimatedTax: 98028
                        rateNote: RATE_NOTE_PLACEHOLDER
                      selfUseTaxResult:
                        estimatedTax: 49014
                        rateNote: RATE_NOTE_PLACEHOLDER
                    nextAction: prepare-pdf
        "400":
          description: Invalid land input or calculation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"
        "404":
          description: CPI index was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"

  /api/gpts/prepare-pdf:
    post:
      tags: [GPTs]
      operationId: gptsPreparePdf
      summary: Prepare a PDF for GPTs and return JSON metadata
      description: Prepare a short-lived PDF download link after calculation. If Authorization header is unavailable, pass sessionToken in the request body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfPrepareRequest"
            examples:
              v16ProductionBaseline:
                value:
                  confirmedLandData:
                    landCityDistrict: CITY_DISTRICT_PLACEHOLDER
                    landSection: LAND_SECTION_PLACEHOLDER
                    landNumber: "123-1"
                    landArea: 100
                    ownershipRange: "1/1"
                    previousTransferYearMonth: "04801"
                    currentTransferYearMonth: "11504"
                    previousDeclaredValuePerSqm: 1000
                    currentDeclaredValuePerSqm: 5000
                  calculationResult:
                    success: true
                    formulaVersion: land-tax-v1.0.0
                    previousIndexValue: 9.86
                    currentIndexValue: 111.23
                    taxIndexMultiplier: 0.0986
                    currentTotalValue: 500000
                    adjustedPreviousTotalValue: 9860
                    taxableIncrement: 490140
                    generalTaxResult:
                      estimatedTax: 98028
                      rateNote: RATE_NOTE_PLACEHOLDER
                    selfUseTaxResult:
                      estimatedTax: 49014
                      rateNote: RATE_NOTE_PLACEHOLDER
                  businessCardData:
                    agentName: AGENT_NAME_PLACEHOLDER
                    phone: PHONE_PLACEHOLDER
                    storeName: CONTACT_STORE_NAME_PLACEHOLDER
                  sessionToken: SESSION_TOKEN_PLACEHOLDER
      responses:
        "200":
          description: PDF was prepared successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsPreparePdfSuccess"
        "400":
          description: PDF generation failed or forbidden input keys were included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sessionToken
      description: Short-lived sessionToken returned by gptsLogin.

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [storeCode, authCode]
      properties:
        storeCode:
          type: string
          example: CH006
        authCode:
          type: string
          format: password
          example: DO_NOT_USE_REAL_AUTH_CODE

    StoreProfile:
      type: object
      additionalProperties: false
      properties:
        storeCode:
          type: string
          example: CH006
        storeName:
          type: [string, "null"]
          example: STORE_NAME_PLACEHOLDER
        brokerageName:
          type: [string, "null"]
          example: BROKERAGE_NAME_PLACEHOLDER
        brokerName:
          type: [string, "null"]
          example: BROKER_NAME_PLACEHOLDER
        brokerLicenseNo:
          type: [string, "null"]
          example: BROKER_LICENSE_PLACEHOLDER
        watermarkText:
          type: [string, "null"]
          example: WATERMARK_TEXT_PLACEHOLDER
        expiresAt:
          type: [string, "null"]
          format: date
          example: "2099-08-26"

    GptsLoginSuccess:
      type: object
      additionalProperties: false
      required: [success, data, nextAction]
      properties:
        success:
          const: true
        data:
          type: object
          additionalProperties: false
          required: [sessionToken, store]
          properties:
            sessionToken:
              type: string
              example: SESSION_TOKEN_PLACEHOLDER
            store:
              $ref: "#/components/schemas/StoreProfile"
        nextAction:
          const: calculate

    CalculateRequest:
      type: object
      additionalProperties: false
      required:
        - landArea
        - ownershipNumerator
        - ownershipDenominator
        - previousTransferYearMonth
        - currentTransferYearMonth
        - previousDeclaredValuePerSqm
        - currentDeclaredValuePerSqm
      properties:
        sessionToken:
          type: string
          description: Short-lived sessionToken returned by gptsLogin. Use only when Authorization header is unavailable.
          example: SESSION_TOKEN_PLACEHOLDER
        landArea:
          type: number
          minimum: 0
        ownershipNumerator:
          type: number
          minimum: 0
        ownershipDenominator:
          type: number
          exclusiveMinimum: 0
        previousTransferYearMonth:
          type: string
          pattern: "^[0-9]{5}$"
        currentTransferYearMonth:
          type: string
          pattern: "^[0-9]{5}$"
        previousDeclaredValuePerSqm:
          type: number
          minimum: 0
        currentDeclaredValuePerSqm:
          type: number
          minimum: 0
        improvementCost:
          type: number
          minimum: 0
          default: 0
        landReadjustmentCost:
          type: number
          minimum: 0
          default: 0
        engineeringBenefitFee:
          type: number
          minimum: 0
          default: 0

    TaxResult:
      type: object
      additionalProperties: false
      required: [estimatedTax, rateNote]
      properties:
        estimatedTax:
          type: number
        rateNote:
          type: string

    CalculateResult:
      type: object
      additionalProperties: true
      required:
        - success
        - formulaVersion
        - previousIndexValue
        - currentIndexValue
        - taxIndexMultiplier
        - currentTotalValue
        - adjustedPreviousTotalValue
        - taxableIncrement
        - generalTaxResult
        - selfUseTaxResult
      properties:
        success:
          const: true
        formulaVersion:
          type: string
          example: land-tax-v1.0.0
        previousIndexValue:
          type: number
        currentIndexValue:
          type: number
        taxIndexMultiplier:
          type: number
          description: Previous tax price index divided by 100. currentIndexValue is returned for reference and is not used as the multiplier.
        currentTotalValue:
          type: number
        adjustedPreviousTotalValue:
          type: number
        taxableIncrement:
          type: number
        generalTaxResult:
          $ref: "#/components/schemas/TaxResult"
        selfUseTaxResult:
          $ref: "#/components/schemas/TaxResult"

    GptsCalculateSuccess:
      type: object
      additionalProperties: false
      required: [success, data, nextAction]
      properties:
        success:
          const: true
        data:
          $ref: "#/components/schemas/CalculateResult"
        nextAction:
          const: prepare-pdf

    PdfPrepareRequest:
      type: object
      additionalProperties: false
      required: [confirmedLandData, calculationResult]
      properties:
        sessionToken:
          type: string
          description: Short-lived sessionToken returned by gptsLogin. Use only when Authorization header is unavailable.
          example: SESSION_TOKEN_PLACEHOLDER
        confirmedLandData:
          type: object
          additionalProperties: true
          description: User-confirmed PDF land fields. Include landCityDistrict, landSection, landNumber, landArea, ownershipRange, previous/current year-month and values.
          properties:
            landCityDistrict:
              type: string
              description: County/city plus district or township for PDF display.
              example: CITY_DISTRICT_PLACEHOLDER
            landSection:
              type: string
              description: Land section name for PDF display.
              example: LAND_SECTION_PLACEHOLDER
            landNumber:
              type: string
              description: Land number for PDF display.
              example: "0318-0000"
            landArea:
              type: number
              description: Land area in square meters.
              example: 107.77
            ownershipRange:
              type: string
              description: Ownership range, for example 1/1. Transcript value 全部 may be sent as 1/1.
              example: "1/1"
            previousTransferYearMonth:
              type: string
              pattern: "^[0-9]{5}$"
              example: "10210"
            currentTransferYearMonth:
              type: string
              pattern: "^[0-9]{5}$"
              description: API field mapped from 公告土地現值年月.
              example: "11501"
            previousDeclaredValuePerSqm:
              type: number
              example: 1619.6
            currentDeclaredValuePerSqm:
              type: number
              description: API field mapped from 公告土地現值.
              example: 1900
        calculationResult:
          $ref: "#/components/schemas/CalculateResult"
        businessCardData:
          type: object
          additionalProperties: false
          description: Optional contact-card fields only; not official store disclosure.
          properties:
            agentName:
              type: string
            phone:
              type: string
            storeName:
              type: string

    GptsPreparePdfSuccess:
      type: object
      additionalProperties: false
      required: [success, data, nextAction]
      properties:
        success:
          const: true
        data:
          type: object
          additionalProperties: false
          required: [downloadUrl, expiresInMinutes, storeProfileSummary]
          properties:
            downloadUrl:
              type: string
              format: uri
              example: PDF_DOWNLOAD_URL_PLACEHOLDER
            expiresInMinutes:
              type: number
              example: 15
            storeProfileSummary:
              anyOf:
                - $ref: "#/components/schemas/StoreProfile"
                - type: "null"
        nextAction:
          const: download

    GptsError:
      type: object
      additionalProperties: false
      required: [success, errorCode, stage]
      properties:
        success:
          const: false
        errorCode:
          type: string
          enum:
            - AUTH_FAILED
            - TAX_INDEX_UPLOAD_FAILED
            - TAX_INDEX_PARSE_FAILED
            - TAX_INDEX_NOT_FOUND
            - LAND_FIELD_MISSING
            - CALCULATION_FAILED
            - PDF_GENERATION_FAILED
            - PDF_TOKEN_EXPIRED
            - PDF_TOKEN_INVALID
            - VERCEL_API_TIMEOUT
            - UNKNOWN_ERROR
        reason:
          type: string
          enum:
            - missing_credentials
            - store_user_not_found
            - store_user_inactive
            - store_user_expired
            - invalid_auth_hash
            - invalid_auth_code
            - store_auth_error
        stage:
          type: string
          enum: [login, calculate, prepare-pdf, method]
        sourceStatus:
          type: number
