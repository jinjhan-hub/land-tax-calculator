openapi: 3.1.0
info:
  title: Land Tax Calculator GPTs Wrapper Actions
  version: 0.2.1-draft
  description: GPTs Actions schema for the land-tax-calculator /api/gpts JSON wrapper endpoints. Do not put real auth codes, session tokens, secrets, PDFs, or full PDF download URLs in this file.
servers:
  - url: https://land-tax-calculator-xi.vercel.app
    description: Production Vercel deployment
tags:
  - name: GPTs
    description: JSON-friendly wrapper endpoints for GPTs Actions.
paths:
  /api/gpts/login:
    post:
      tags: [GPTs]
      operationId: gptsLogin
      summary: Login a store for GPTs
      description: Authenticate a store user and create a short-lived session for GPTs land tax calculation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              placeholder:
                value:
                  storeCode: CH006
                  authCode: DO_NOT_USE_REAL_AUTH_CODE
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsLoginSuccess"
        "401":
          description: Login failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"
  /api/gpts/calculate:
    post:
      tags: [GPTs]
      operationId: gptsCalculate
      summary: Calculate land value increment tax for GPTs
      description: Calculate land tax through the GPTs wrapper. Use after login. If Authorization header is unavailable, pass sessionToken in the request body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateRequest"
      responses:
        "200":
          description: Calculation succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsCalculateSuccess"
        "400":
          description: Invalid land input or calculation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"
        "404":
          description: Tax price index was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"
  /api/gpts/prepare-pdf:
    post:
      tags: [GPTs]
      operationId: gptsPreparePdf
      summary: Prepare a PDF for GPTs and return JSON metadata
      description: Prepare a short-lived PDF download link after calculation. If Authorization header is unavailable, pass sessionToken in the request body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfPrepareRequest"
            examples:
              simplified:
                value:
                  sessionToken: SESSION_TOKEN_PLACEHOLDER
                  confirmedLandData:
                    landCityDistrict: CITY_DISTRICT_PLACEHOLDER
                    landSection: LAND_SECTION_PLACEHOLDER
                    landNumber: "0318-0000"
                    landArea: 1073.77
                    ownershipRange: "1/1"
                    landUrbanPlanningLabel: "非都市計畫內"
                    previousTransferYearMonth: "10210"
                    currentTransferYearMonth: "11501"
                    previousDeclaredValuePerSqm: 1619.6
                    currentDeclaredValuePerSqm: 1900
                  calculationResult:
                    success: true
                    formulaVersion: land-tax-v1.0.0
                    previousIndexValue: 94.66
                    currentIndexValue: 110.22
                    taxIndexMultiplier: 0.9466
                    currentTotalValue: 2040163
                    adjustedPreviousTotalValue: 1646211.1325672
                    taxableIncrement: 393951.8674328
                    generalTaxResult:
                      estimatedTax: 78790
                      rateNote: RATE_NOTE_PLACEHOLDER
                    selfUseTaxResult:
                      estimatedTax: 39395
                      rateNote: 自用住宅優惠稅率 10% 情境試算
                  businessCardData:
                    agentName: AGENT_NAME_PLACEHOLDER
                    phone: PHONE_PLACEHOLDER
                    storeName: CONTACT_STORE_NAME_PLACEHOLDER
      responses:
        "200":
          description: PDF was prepared successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsPreparePdfSuccess"
        "400":
          description: PDF generation failed or required PDF display fields were missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptsError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sessionToken
      description: Short-lived sessionToken returned by gptsLogin.
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [storeCode, authCode]
      properties:
        storeCode:
          type: string
          example: CH006
        authCode:
          type: string
          format: password
          example: DO_NOT_USE_REAL_AUTH_CODE
    StoreProfile:
      type: object
      additionalProperties: false
      properties:
        storeCode:
          type: string
          example: CH006
        storeName:
          type: [string, "null"]
          example: STORE_NAME_PLACEHOLDER
        brokerageName:
          type: [string, "null"]
          example: BROKERAGE_NAME_PLACEHOLDER
        brokerName:
          type: [string, "null"]
          example: BROKER_NAME_PLACEHOLDER
        brokerLicenseNo:
          type: [string, "null"]
          example: BROKER_LICENSE_PLACEHOLDER
        watermarkText:
          type: [string, "null"]
          example: WATERMARK_TEXT_PLACEHOLDER
        expiresAt:
          type: [string, "null"]
          format: date
          example: "2099-08-26"
    GptsLoginSuccess:
      type: object
      additionalProperties: false
      required: [success, data, nextAction]
      properties:
        success:
          const: true
        data:
          type: object
          additionalProperties: false
          required: [sessionToken, store]
          properties:
            sessionToken:
              type: string
              example: SESSION_TOKEN_PLACEHOLDER
            store:
              $ref: "#/components/schemas/StoreProfile"
        nextAction:
          const: calculate
    CalculateRequest:
      type: object
      additionalProperties: false
      required:
        - landArea
        - ownershipNumerator
        - ownershipDenominator
        - previousTransferYearMonth
        - currentTransferYearMonth
        - previousDeclaredValuePerSqm
        - currentDeclaredValuePerSqm
      properties:
        sessionToken:
          type: string
          description: Short-lived sessionToken returned by gptsLogin. Use only when Authorization header is unavailable.
          example: SESSION_TOKEN_PLACEHOLDER
        landArea:
          type: number
          minimum: 0
          description: Land area in square meters. Keep this consistent with prepare-pdf confirmedLandData.landArea.
        ownershipNumerator:
          type: number
          minimum: 0
        ownershipDenominator:
          type: number
          exclusiveMinimum: 0
        previousTransferYearMonth:
          type: string
          pattern: "^[0-9]{5}$"
        currentTransferYearMonth:
          type: string
          pattern: "^[0-9]{5}$"
          description: API field whose user-facing meaning is 公告土地現值年月.
        previousDeclaredValuePerSqm:
          type: number
          minimum: 0
        currentDeclaredValuePerSqm:
          type: number
          minimum: 0
          description: API field mapped from 公告土地現值.
        improvementCost:
          type: number
          minimum: 0
          default: 0
        landReadjustmentCost:
          type: number
          minimum: 0
          default: 0
        engineeringBenefitFee:
          type: number
          minimum: 0
          default: 0
    TaxResult:
      type: object
      additionalProperties: false
      required: [estimatedTax, rateNote]
      properties:
        estimatedTax:
          type: number
        rateNote:
          type: string
    CalculateResult:
      type: object
      additionalProperties: true
      required:
        - success
        - formulaVersion
        - previousIndexValue
        - currentIndexValue
        - taxIndexMultiplier
        - currentTotalValue
        - adjustedPreviousTotalValue
        - taxableIncrement
        - generalTaxResult
        - selfUseTaxResult
      properties:
        success:
          const: true
        formulaVersion:
          type: string
          example: land-tax-v1.0.0
        previousIndexValue:
          type: number
        currentIndexValue:
          type: number
          description: Returned for reference only and not used as the adjustment multiplier.
        taxIndexMultiplier:
          type: number
          description: Previous tax price index divided by 100.
        currentTotalValue:
          type: number
        adjustedPreviousTotalValue:
          type: number
        taxableIncrement:
          type: number
        generalTaxResult:
          $ref: "#/components/schemas/TaxResult"
        selfUseTaxResult:
          $ref: "#/components/schemas/TaxResult"
    GptsCalculateSuccess:
      type: object
      additionalProperties: false
      required: [success, data, nextAction]
      properties:
        success:
          const: true
        data:
          $ref: "#/components/schemas/CalculateResult"
        nextAction:
          const: prepare-pdf
    PdfPrepareRequest:
      type: object
      additionalProperties: false
      required: [confirmedLandData, calculationResult]
      properties:
        sessionToken:
          type: string
          description: Short-lived sessionToken returned by gptsLogin. Use only when Authorization header is unavailable.
          example: SESSION_TOKEN_PLACEHOLDER
        confirmedLandData:
          type: object
          additionalProperties: true
          description: PDF land fields. Include location, area, ownership, announced land value month/value, and urban planning fields.
          properties:
            landCityDistrict:
              type: string
              description: County/city plus district or township for PDF display.
              example: CITY_DISTRICT_PLACEHOLDER
            landSection:
              type: string
              description: Land section name for PDF display.
              example: LAND_SECTION_PLACEHOLDER
            landNumber:
              type: string
              description: Land number for PDF display.
              example: "0318-0000"
            landArea:
              type: number
              description: Land area in square meters. Preserve thousands separators when reading transcript text, for example 1,073.77.
              example: 1073.77
            ownershipRange:
              type: string
              description: Ownership range, for example 1/1. Transcript value 全部 may be sent as 1/1.
              example: "1/1"
            landUrbanPlanningLabel:
              type: string
              enum: ["都市計畫內", "非都市計畫內"]
              description: Urban planning display label for the PDF.
              example: "非都市計畫內"
            landUrbanPlanningType:
              type: string
              enum: [urban, nonUrban]
              description: Optional normalized urban planning type.
              example: nonUrban
            useDistrict:
              type: string
              description: Transcript 使用分區. Blank with blank landUseCategory means 都市計畫內.
              example: 特定農業區
            landUseCategory:
              type: string
              description: Transcript 使用地類別. Any concrete value means 非都市計畫內.
              example: 農牧用地
            previousTransferYearMonth:
              type: string
              pattern: "^[0-9]{5}$"
              example: "10210"
            currentTransferYearMonth:
              type: string
              pattern: "^[0-9]{5}$"
              description: API field mapped from 公告土地現值年月.
              example: "11501"
            previousDeclaredValuePerSqm:
              type: number
              example: 1619.6
            currentDeclaredValuePerSqm:
              type: number
              description: API field mapped from 公告土地現值.
              example: 1900
        calculationResult:
          $ref: "#/components/schemas/CalculateResult"
        businessCardData:
          type: object
          additionalProperties: false
          description: Optional contact-card fields only; not official store disclosure.
          properties:
            agentName:
              type: string
            phone:
              type: string
            storeName:
              type: string
    GptsPreparePdfSuccess:
      type: object
      additionalProperties: false
      required: [success, data, nextAction]
      properties:
        success:
          const: true
        data:
          type: object
          additionalProperties: false
          required: [downloadUrl, expiresInMinutes, storeProfileSummary]
          properties:
            downloadUrl:
              type: string
              format: uri
              example: PDF_DOWNLOAD_URL_PLACEHOLDER
            expiresInMinutes:
              type: number
              example: 15
            storeProfileSummary:
              anyOf:
                - $ref: "#/components/schemas/StoreProfile"
                - type: "null"
        nextAction:
          const: download
    GptsError:
      type: object
      additionalProperties: false
      required: [success, errorCode, stage]
      properties:
        success:
          const: false
        errorCode:
          type: string
          enum:
            - AUTH_FAILED
            - TAX_INDEX_UPLOAD_FAILED
            - TAX_INDEX_PARSE_FAILED
            - TAX_INDEX_NOT_FOUND
            - LAND_FIELD_MISSING
            - CALCULATION_FAILED
            - PDF_GENERATION_FAILED
            - PDF_TOKEN_EXPIRED
            - PDF_TOKEN_INVALID
            - VERCEL_API_TIMEOUT
            - UNKNOWN_ERROR
        reason:
          type: string
        stage:
          type: string
          enum: [login, calculate, prepare-pdf, method]
        sourceStatus:
          type: number
        missingFields:
          type: array
          items:
            type: string
